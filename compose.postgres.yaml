services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jianghu}
      POSTGRES_USER: ${POSTGRES_USER:-jianghu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.docker 中设置 POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - jianghu-postgres:/var/lib/postgresql/data

  jianghu-online:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JIANGHU_DATABASE_URL: postgresql://${POSTGRES_USER:-jianghu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jianghu}

volumes:
  jianghu-postgres:
    name: jianghu-postgres
