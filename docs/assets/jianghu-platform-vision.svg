<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">江湖 Online 产品理念图</title>
  <desc id="desc">以大江湖为公共世界，连接小江湖团队、人物、委托、生产流和事件现场。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071b35"/>
      <stop offset="0.58" stop-color="#102f4a"/>
      <stop offset="1" stop-color="#071a2d"/>
    </linearGradient>
    <radialGradient id="worldGlow" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#f5d88a" stop-opacity="0.32"/>
      <stop offset="0.52" stop-color="#4ab3a3" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#061326" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b3"/>
      <stop offset="0.42" stop-color="#e4b963"/>
      <stop offset="1" stop-color="#9b6330"/>
    </linearGradient>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9be0c2"/>
      <stop offset="1" stop-color="#2c897e"/>
    </linearGradient>
    <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c9"/>
      <stop offset="1" stop-color="#caa967"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#e7c879"/>
    </marker>
    <marker id="arrowJade" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6bd0b2"/>
    </marker>
    <pattern id="mapLines" width="90" height="90" patternUnits="userSpaceOnUse">
      <path d="M0 45 H90 M45 0 V90" stroke="#7db3b0" stroke-opacity="0.06" stroke-width="1"/>
      <circle cx="45" cy="45" r="2" fill="#e7c879" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#worldGlow)"/>
  <rect x="42" y="42" width="1516" height="816" rx="34" fill="url(#mapLines)" stroke="#d8bd76" stroke-opacity="0.24"/>

  <g opacity="0.42" fill="#071626" stroke="#76a89c" stroke-opacity="0.38" stroke-width="3">
    <path d="M42 485 L180 340 270 425 360 270 505 455 630 338 765 470 900 300 1048 455 1175 340 1300 450 1450 315 1558 455 V858 H42Z"/>
    <path d="M42 610 L170 510 290 590 412 492 560 620 700 520 840 615 1000 480 1140 590 1270 510 1430 610 1558 530 V858 H42Z" fill="#0c2940"/>
  </g>
  <path d="M70 690 C340 600 480 780 740 665 S1190 560 1530 700" fill="none" stroke="#68b4a8" stroke-opacity="0.38" stroke-width="18" filter="url(#soft)"/>
  <path d="M70 690 C340 600 480 780 740 665 S1190 560 1530 700" fill="none" stroke="#4e998f" stroke-opacity="0.65" stroke-width="3"/>

  <g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#fff4d2">
    <text x="100" y="118" font-size="42" font-weight="700" letter-spacing="8">江湖 ONLINE</text>
    <text x="104" y="158" font-size="18" fill="#b6d5cc" letter-spacing="4">多智能体协演场 · 让组织拥有可运行的江湖</text>
  </g>

  <!-- 大江湖 -->
  <g transform="translate(800 265)">
    <circle r="190" fill="#0b2c43" fill-opacity="0.86" stroke="#e7c879" stroke-opacity="0.3" stroke-width="2"/>
    <circle r="160" fill="none" stroke="url(#gold)" stroke-width="3" stroke-dasharray="8 14" filter="url(#glow)"/>
    <path d="M-128 55 L-65 -28 0 35 66 -36 137 55 V96 H-128Z" fill="#153e51" stroke="#75b6a6" stroke-width="3"/>
    <path d="M-168 92 Q0 44 168 92" fill="none" stroke="#6bd0b2" stroke-opacity="0.75" stroke-width="4"/>
    <circle cx="0" cy="-62" r="46" fill="#f7dc86" fill-opacity="0.14" stroke="url(#gold)" stroke-width="3" filter="url(#glow)"/>
    <path d="M-22 -74 Q0 -100 22 -74 M-24 -51 Q0 -30 24 -51" fill="none" stroke="#f9e9b0" stroke-width="3" stroke-linecap="round"/>
    <g font-family="Microsoft YaHei, PingFang SC, sans-serif" text-anchor="middle">
      <text y="124" font-size="34" font-weight="700" fill="#fff1b8">大江湖</text>
      <text y="151" font-size="16" fill="#b8ddd2">公共知识 · 规则 · 人物资源</text>
    </g>
  </g>

  <!-- public knowledge scroll -->
  <g transform="translate(1135 108) rotate(5)">
    <path d="M0 0 H260 V112 H0Z" fill="url(#parchment)" fill-opacity="0.92" stroke="#98663c" stroke-width="4"/>
    <path d="M0 0 Q-28 14 0 28 Q-28 42 0 56 Q-28 70 0 84 Q-28 98 0 112" fill="none" stroke="#d9b46e" stroke-width="10"/>
    <path d="M260 0 Q288 14 260 28 Q288 42 260 56 Q288 70 260 84 Q288 98 260 112" fill="none" stroke="#d9b46e" stroke-width="10"/>
    <g stroke="#836044" stroke-width="4" opacity="0.62">
      <path d="M34 34 H220 M34 56 H205 M34 78 H215"/>
    </g>
    <text x="130" y="101" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#76513a">共同知识卷</text>
  </g>

  <!-- paths from the world to teams -->
  <g fill="none" stroke-linecap="round">
    <path d="M680 365 C520 400 388 430 285 485" stroke="#e7c879" stroke-width="3" stroke-dasharray="8 10" marker-end="url(#arrowGold)"/>
    <path d="M920 365 C1080 400 1208 430 1315 485" stroke="#6bd0b2" stroke-width="3" stroke-dasharray="8 10" marker-end="url(#arrowJade)"/>
    <path d="M700 395 C555 520 515 590 445 650" stroke="#6bd0b2" stroke-width="3" stroke-dasharray="8 10" marker-end="url(#arrowJade)"/>
    <path d="M900 395 C1045 520 1085 590 1155 650" stroke="#e7c879" stroke-width="3" stroke-dasharray="8 10" marker-end="url(#arrowGold)"/>
  </g>

  <!-- 小江湖 cards -->
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <g transform="translate(115 445)">
      <rect width="330" height="166" rx="24" fill="#0a273d" fill-opacity="0.92" stroke="#d9b86d" stroke-width="2"/>
      <circle cx="66" cy="77" r="42" fill="#1b5360" stroke="#75c4aa" stroke-width="3"/>
      <path d="M47 88 Q66 58 85 88 M54 70 Q66 55 78 70" fill="none" stroke="#e7d28e" stroke-width="4"/>
      <circle cx="55" cy="75" r="4" fill="#f6e9ba"/><circle cx="77" cy="75" r="4" fill="#f6e9ba"/>
      <text x="132" y="62" font-size="28" font-weight="700" fill="#ffe9a2">创新小江湖</text>
      <text x="132" y="92" font-size="15" fill="#a8d1c5">灵感 · 试验 · 新人物</text>
      <path d="M132 119 H286 M132 137 H245" stroke="#5ca997" stroke-width="5" stroke-linecap="round"/>
    </g>

    <g transform="translate(1155 445)">
      <rect width="330" height="166" rx="24" fill="#0a273d" fill-opacity="0.92" stroke="#68c6ab" stroke-width="2"/>
      <circle cx="66" cy="77" r="42" fill="#1b5360" stroke="#e7c879" stroke-width="3"/>
      <path d="M46 92 L66 54 87 92 M55 82 H78" fill="none" stroke="#f5df9a" stroke-width="4"/>
      <text x="132" y="62" font-size="28" font-weight="700" fill="#b9f0d0">任务小江湖</text>
      <text x="132" y="92" font-size="15" fill="#a8d1c5">应标 · 协作 · 交付</text>
      <path d="M132 119 H286 M132 137 H245" stroke="#d2ad5f" stroke-width="5" stroke-linecap="round"/>
    </g>

    <g transform="translate(285 640)">
      <rect width="330" height="166" rx="24" fill="#0a273d" fill-opacity="0.92" stroke="#68c6ab" stroke-width="2"/>
      <circle cx="66" cy="77" r="42" fill="#1b5360" stroke="#d8bd76" stroke-width="3"/>
      <path d="M44 94 Q66 54 88 94 M53 71 Q66 59 79 71" fill="none" stroke="#f5df9a" stroke-width="4"/>
      <text x="132" y="62" font-size="28" font-weight="700" fill="#b9f0d0">商业小江湖</text>
      <text x="132" y="92" font-size="15" fill="#a8d1c5">价值 · 路线 · 经营</text>
      <path d="M132 119 H286 M132 137 H245" stroke="#5ca997" stroke-width="5" stroke-linecap="round"/>
    </g>

    <g transform="translate(985 640)">
      <rect width="330" height="166" rx="24" fill="#0a273d" fill-opacity="0.92" stroke="#d9b86d" stroke-width="2"/>
      <circle cx="66" cy="77" r="42" fill="#1b5360" stroke="#75c4aa" stroke-width="3"/>
      <path d="M47 91 Q66 59 85 91 M52 73 H80" fill="none" stroke="#f5df9a" stroke-width="4"/>
      <text x="132" y="62" font-size="28" font-weight="700" fill="#ffe9a2">工程小江湖</text>
      <text x="132" y="92" font-size="15" fill="#a8d1c5">实现 · 测试 · 验证</text>
      <path d="M132 119 H286 M132 137 H245" stroke="#d2ad5f" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- event arena -->
  <g transform="translate(800 704)">
    <ellipse rx="262" ry="118" fill="#081b2e" fill-opacity="0.94" stroke="#e7c879" stroke-width="3"/>
    <ellipse rx="220" ry="82" fill="none" stroke="#5ec4ad" stroke-opacity="0.62" stroke-width="3" stroke-dasharray="5 12"/>
    <path d="M-184 18 H184" stroke="#d9b86d" stroke-width="4" stroke-linecap="round"/>
    <path d="M-138 -10 H-52 M-24 -10 H64 M92 -10 H150" stroke="#74d2b2" stroke-width="7" stroke-linecap="round"/>
    <g fill="#f5df9a" stroke="#0b2438" stroke-width="4">
      <circle cx="-152" cy="38" r="18"/><circle cx="-78" cy="-35" r="18"/><circle cx="9" cy="38" r="18"/><circle cx="95" cy="-35" r="18"/><circle cx="160" cy="38" r="18"/>
    </g>
    <g fill="none" stroke="#f5df9a" stroke-width="5" stroke-linecap="round">
      <path d="M-152 57 V85 M-170 71 H-134"/><path d="M-78 -16 V12 M-96 -2 H-60"/><path d="M9 57 V85 M-9 71 H27"/><path d="M95 -16 V12 M77 -2 H113"/><path d="M160 57 V85 M142 71 H178"/>
    </g>
    <g font-family="Microsoft YaHei, PingFang SC, sans-serif" text-anchor="middle">
      <text y="-72" font-size="34" font-weight="700" fill="#fff0ae">事件现场</text>
      <text y="112" font-size="16" fill="#b8ddd2">议事 → 行动 → 验证 → 一页纸结论</text>
    </g>
  </g>

  <g transform="translate(75 825)" font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <circle cx="12" cy="0" r="6" fill="#e7c879"/><text x="28" y="6" font-size="16" fill="#b8ddd2">公共世界承载共同知识与规则</text>
    <circle cx="325" cy="0" r="6" fill="#6bd0b2"/><text x="341" y="6" font-size="16" fill="#b8ddd2">小江湖承接具体事情</text>
    <circle cx="598" cy="0" r="6" fill="#f5df9a"/><text x="614" y="6" font-size="16" fill="#b8ddd2">人物随组织进入生产流</text>
  </g>
</svg>
